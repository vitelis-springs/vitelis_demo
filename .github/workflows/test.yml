name: Test
on: push
jobs:
  page_components_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn test
