name: Orchestrator Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger orchestrator cron
        run: |
          curl -sf -X POST "$PROD_APP_URL/api/internal/orchestrator-cron" \
            -H "x-internal-cron-secret: $INTERNAL_CRON_SECRET"
        env:
          PROD_APP_URL: ${{ secrets.PROD_APP_URL }}
          INTERNAL_CRON_SECRET: ${{ secrets.INTERNAL_CRON_SECRET }}
